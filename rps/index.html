<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://officialpic.vilarci.in/Icons/web-icon.png">
    <link rel="shortcut icon" type="image/png" href="https://officialpic.vilarci.in/Icons/web-icon.png">
    <link rel="apple-touch-icon" href="https://officialpic.vilarci.in/Icons/web-icon.png">
    <link rel="canonical" href="https://officialpic.vilarci.in/Icons/web-icon.png">
    <title>Rock Paper Scissors</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle Theme" style="position: absolute; top: 20px; right: 20px; z-index: 100; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; cursor: pointer; color: inherit; backdrop-filter: blur(5px);">
        <i class="ph-duotone ph-sun" id="theme-icon" style="font-size: 1.5rem;"></i>
    </button>
    <div class="background-animation"></div>
    <main>
        <div class="header">
            <a href="../index.html" class="btn-back">← Back</a>
            <div style='display:flex; justify-content:center; align-items:center; margin-bottom: 1rem;'><img src="https://officialpic.vilarci.in/Icons/web-icon.png" alt="Vilarci Logo" style="height: 50px; width: auto; border-radius: 12px; margin-right: 15px; vertical-align: middle;"><h1 class="glow-text">Rock Paper Scissors</h1></div>
        </div>
        
        <div class="glass-panel game-container">
            <div class="scoreboard">
                <div class="score-card player">
                    <span class="label">Player</span>
                    <span class="value" id="score-player">0</span>
                </div>
                <div class="score-card computer">
                    <span class="label">Computer</span>
                    <span class="value" id="score-computer">0</span>
                </div>
            </div>

            <div class="battle-arena">
                <div class="choice-display" id="player-choice">❓</div>
                <div class="vs-text">VS</div>
                <div class="choice-display" id="computer-choice">❓</div>
            </div>

            <div class="result-text" id="result-text">Make your move!</div>
            
            <div class="controls">
                <button class="choice-btn" data-choice="rock">🪨</button>
                <button class="choice-btn" data-choice="paper">📄</button>
                <button class="choice-btn" data-choice="scissors">✂️</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
<script src="../favicon.js"></script>
    <script src="../theme.js"></script>
</body>
</html>
