<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://officialpic.vilarci.in/Icons/web-icon.png">
    <link rel="shortcut icon" type="image/png" href="https://officialpic.vilarci.in/Icons/web-icon.png">
    <link rel="apple-touch-icon" href="https://officialpic.vilarci.in/Icons/web-icon.png">
    <link rel="canonical" href="https://officialpic.vilarci.in/Icons/web-icon.png">
    <title>Tic Tac Toe - Next Level</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Tic Tac Toe.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle Theme" style="position: absolute; top: 20px; right: 20px; z-index: 100; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; cursor: pointer; color: inherit; backdrop-filter: blur(5px);">
        <i class="ph-duotone ph-sun" id="theme-icon" style="font-size: 1.5rem;"></i>
    </button>
    <div class="background-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <main>
        <div style='display:flex; justify-content:center; align-items:center; margin-bottom: 1rem;'><img src="https://officialpic.vilarci.in/Icons/web-icon.png" alt="Vilarci Logo" style="height: 50px; width: auto; border-radius: 12px; margin-right: 15px; vertical-align: middle;"><h1 class="glow-text">Tic Tac Toe</h1></div>

        <!-- Menu View -->
        <div id="menu-view" class="glass-panel active">
            <h2>Select Mode</h2>
            <button id="btn-pvp" class="btn btn-primary">Player vs. Player</button>
            <div class="spacer"></div>
            <h2>Single Player</h2>
            <button id="btn-pve-easy" class="btn btn-secondary">Easy (Random)</button>
            <button id="btn-pve-medium" class="btn btn-secondary">Medium (Block)</button>
            <button id="btn-pve-hard" class="btn btn-danger">Impossible (Minimax)</button>
        </div>
        
        <!-- Game View -->
        <div id="game-view" class="glass-panel hidden">
            <div class="top-bar">
                <button id="btn-back" class="btn btn-small">← Back</button>
                <div class="turn-indicator" id="turn-indicator">Player X's Turn</div>
                <button id="btn-reset" class="btn btn-small">Reset</button>
            </div>
            
            <div class="score-board">
                <div class="score-card player-x">
                    <span class="player-name">Player X</span>
                    <span class="score-value" id="score-x">0</span>
                </div>
                <div class="score-card player-o">
                    <span class="player-name" id="player-o-name">Player O</span>
                    <span class="score-value" id="score-o">0</span>
                </div>
            </div>

            <div class="board-container">
                <div class="board" id="board">
                    <!-- Boxes will be generated by JS to keep HTML clean -->
                </div>
                <div class="strike-line" id="strike-line"></div>
            </div>
            
            <div id="game-over-modal" class="modal hidden">
                <div class="modal-content glass-panel">
                    <h2 id="win-msg" class="glow-text">Winner!</h2>
                    <p>Total Moves: <span id="total-moves">0</span></p>
                    <button id="btn-play-again" class="btn btn-primary">Play Again</button>
                </div>
            </div>
        </div>
    </main>

    <script src="main.js"></script>
<script src="../favicon.js"></script>
    <script src="../theme.js"></script>
</body>
</html>
