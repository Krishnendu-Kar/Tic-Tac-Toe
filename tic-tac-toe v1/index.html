<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/png" href="https://officialpic.vilarci.in/Icons/web-icon.png">
    <link rel="shortcut icon" type="image/png" href="https://officialpic.vilarci.in/Icons/web-icon.png">
    <link rel="apple-touch-icon" href="https://officialpic.vilarci.in/Icons/web-icon.png">
    <link rel="canonical" href="https://officialpic.vilarci.in/Icons/web-icon.png">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="Tic Tac Toe.css">
    <link rel="stylesheet" href="../arcade-responsive.css">
    <meta name="theme-color" content="#0f0a1f">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="ttt-page" data-game="tic-tac-toe">
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle Theme" style="position: absolute; top: 20px; right: 20px; z-index: 100; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; cursor: pointer; color: inherit; backdrop-filter: blur(5px);">
        <i class="ph-duotone ph-sun" id="theme-icon" style="font-size: 1.5rem;"></i>
    </button>
    <main>
        <div class="header">
            <a href="../index.html" class="btn-back btn-arcade-home">← Arcade</a>
            <div style='display:flex; justify-content:center; align-items:center; margin-bottom: 1rem;'><img src="https://officialpic.vilarci.in/Icons/web-icon.png" alt="Vilarci Logo" style="height: 50px; width: auto; border-radius: 12px; margin-right: 15px; vertical-align: middle;"><h1>Tic Tac Toe Game</h1></div>
        </div>

        <div class="game-menu">
            <h2>Choose Your Mode:</h2>
            <button id="btn-2p" class="menu-btn">Player vs. Player</button>
            <button id="btn-computer" class="menu-btn">Player vs. Computer</button>
            <br>
            <h2>Or Try The New Version:</h2>
            <a href="../tic-tac-toe v2/index.html" style="text-decoration: none;">
                <button class="menu-btn" style="background: linear-gradient(135deg, #ff007b, #7000ff);">Play V2 (Next Level)</button>
            </a>
        </div>
        
        <div class="container hidden">
            <div class="msg-container">
                <div class="win-msg" id="win-msg"></div>
            </div>
            <div class="game">
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
            </div>
            <div class="box-count-con">
                <div class="box-count">Total move played in this match: <span id="box-count"> 0</span></div>
            </div>
            
            <button id="reset" class="reset">New / Reset Game</button>
            
            <button id="back-to-menu" class="menu-btn back-btn">Change Mode</button> <div class="score-container">
                <div class="score-wrapper">
                    <div class="score-box">
                        <p>Player X</p>
                        <span id="score-x">0</span>
                    </div>
                    <div class="score-box">
                        <p>Player O</p>
                        <span id="score-o">0</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Get the elements
        const menu = document.querySelector('.game-menu');
        const gameContainer = document.querySelector('.container');
        const btn2Player = document.querySelector('#btn-2p');
        const btnComputer = document.querySelector('#btn-computer');

        // === 2. GET THE NEW BUTTON === -->
        const btnBackToMenu = document.querySelector('#back-to-menu'); // NEW

        // This function dynamically loads a script file
        function loadGameScript(scriptName) {
            const script = document.createElement('script');
            script.src = scriptName;
            document.body.appendChild(script);
        }

        // This function hides the menu and shows the game
        function startGame() {
            menu.classList.add('hidden'); // Hide the menu
            gameContainer.classList.remove('hidden'); // Show the game
        }

        // --- Event Listeners for the menu buttons ---

        btn2Player.addEventListener('click', () => {
            startGame();
            loadGameScript('Tic Tac Toe.js'); // Load 2-player logic
        });

        btnComputer.addEventListener('click', () => {
            startGame();
            loadGameScript('Tic Tac Toe with computer.js'); 
        });

        // === 3. ADD THIS NEW EVENT LISTENER === -->
        // This listener reloads the page to go back to the menu
        btnBackToMenu.addEventListener('click', () => { // NEW
            location.reload(); // NEW
        }); // NEW
    </script>
<script src="../favicon.js"></script>
    <script src="../theme.js"></script>
    <script src="../arcade-mobile.js"></script>
</body>
</html>
